name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.14"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Mypy strict
        run: mypy --strict src

  guards:
    name: Structural guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      # The five guards from docs/steering/tasks.md, run as their own check so
      # that a breach is named on the pull request rather than buried in the
      # wider test run.
      - name: Run guards
        run: pytest tests/test_guards.py -v --no-cov

  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.14" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package and audit tooling
        run: |
          pip install -e "."
          pip install pip-audit cyclonedx-bom

      # The local package is installed editable and is not on PyPI, so it is
      # skipped. Every third party dependency is audited and any advisory
      # fails the job.
      - name: Audit dependencies
        run: pip-audit --skip-editable --progress-spinner off

      - name: Generate SBOM
        run: cyclonedx-py environment --output-format JSON --output-file entrascope.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: entrascope.cdx.json
          if-no-files-found: warn

  install-test:
    name: Install test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Install the built wheel into a clean environment and run the console
      # script. This catches packaging faults an editable install never sees,
      # in particular whether the configuration directory reached the wheel.
      - name: Install the wheel and run the console script
        run: |
          python -m venv /tmp/install-test
          /tmp/install-test/bin/pip install dist/*.whl
          /tmp/install-test/bin/entrascope --version
          /tmp/install-test/bin/entrascope --help
          /tmp/install-test/bin/entrascope doctor --help

      - name: Confirm the packaged configuration is readable
        run: |
          /tmp/install-test/bin/python -c "
          from entrascope.config import load_config
          config = load_config()
          assert config.endpoints.graph.base_url
          assert (config.root / 'kql').is_dir()
          print('configuration read from', config.root)
          "

  mcp-smoke:
    name: MCP smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      # Start the tool surface and list the tools through the in memory client.
      # This proves the server builds and every tool registers, without needing
      # a tenant or a transport.
      - name: List the tools through the in memory client
        run: |
          python -c "
          import asyncio
          from fastmcp import Client
          from entrascope.mcp_stdio import build_server
          from entrascope.mcp_tools import tool_names

          async def main() -> None:
              async with Client(build_server()) as client:
                  tools = await client.list_tools()
              found = {tool.name for tool in tools}
              assert found == set(tool_names()), found
              print('registered', len(found), 'tools')

          asyncio.run(main())
          "

      - name: Confirm the server starts over stdio
        run: |
          printf '' | timeout 10 entrascope serve stdio || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 124 ]; then
            echo "the stdio server exited with ${status}"
            exit 1
          fi

  docker:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built on every pull request so a broken image is caught there, and
      # pushed only from main.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm the image runs
        if: github.event_name == 'pull_request'
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run --rm --entrypoint entrascope "$image" --version
          docker run --rm --entrypoint entrascope "$image" serve http --help

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
