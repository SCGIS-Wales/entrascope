name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.14"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Mypy strict
        run: mypy --strict src

  guards:
    name: Structural guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      # The five guards from docs/steering/tasks.md, run as their own check so
      # that a breach is named on the pull request rather than buried in the
      # wider test run.
      - name: Run guards
        run: pytest tests/test_guards.py -v --no-cov

  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.14" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package and audit tooling
        run: |
          pip install -e "."
          pip install pip-audit cyclonedx-bom

      # The local package is installed editable and is not on PyPI, so it is
      # skipped. Every third party dependency is audited and any advisory
      # fails the job.
      - name: Audit dependencies
        run: pip-audit --skip-editable --progress-spinner off

      - name: Generate SBOM
        run: cyclonedx-py environment --output-format JSON --output-file entrascope.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: entrascope.cdx.json
          if-no-files-found: warn

  install-test:
    name: Install test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Install the built wheel into a clean environment and run the console
      # script. This catches packaging faults an editable install never sees,
      # in particular whether the configuration directory reached the wheel.
      - name: Install the wheel and run the console script
        run: |
          python -m venv /tmp/install-test
          /tmp/install-test/bin/pip install dist/*.whl
          /tmp/install-test/bin/entrascope --version
          /tmp/install-test/bin/entrascope --help
          /tmp/install-test/bin/entrascope doctor --help

      - name: Confirm the packaged configuration is readable
        run: |
          /tmp/install-test/bin/python -c "
          from entrascope.config import load_config
          config = load_config()
          assert config.endpoints.graph.base_url
          assert (config.root / 'kql').is_dir()
          print('configuration read from', config.root)
          "

  mcp-smoke:
    name: MCP smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      # Start the tool surface and list the tools through the in memory client.
      # This proves the server builds and every tool registers, without needing
      # a tenant or a transport.
      - name: List the tools through the in memory client
        run: |
          python -c "
          import asyncio
          from fastmcp import Client
          from entrascope.mcp_stdio import build_server
          from entrascope.mcp_tools import tool_names

          async def main() -> None:
              async with Client(build_server()) as client:
                  tools = await client.list_tools()
              found = {tool.name for tool in tools}
              assert found == set(tool_names()), found
              print('registered', len(found), 'tools')

          asyncio.run(main())
          "

      - name: Confirm the server starts over stdio
        run: |
          printf '' | timeout 10 entrascope serve stdio || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 124 ]; then
            echo "the stdio server exited with ${status}"
            exit 1
          fi

  docker:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built on every pull request so a broken image is caught there, and
      # pushed only from main.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm the image runs
        if: github.event_name == 'pull_request'
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run --rm --entrypoint entrascope "$image" --version
          docker run --rm --entrypoint entrascope "$image" serve http --help

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Everything below runs only on main, and only once the repository variable
  # ENABLE_RELEASE is set. Ten phase merges must not produce ten releases of a
  # package that is not finished.
  auto-tag:
    name: Auto-tag release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_RELEASE == 'true'
    needs: [ lint, typecheck, guards, test, security, build, install-test, mcp-smoke ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.create_tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine the next version
        id: version
        run: |
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEXT=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          else
            CURRENT="${LATEST#v}"
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3 | cut -d- -f1)
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "::notice::Next version ${NEXT}"

      - name: Check whether the tag already exists
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the version, commit and tag
        id: create_tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/entrascope/__init__.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "version already correct, tagging the existing commit"
          else
            git add pyproject.toml src/entrascope/__init__.py
            git commit -m "chore: bump version to ${VERSION} [skip ci]"
            git push origin HEAD:main
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Build the distribution for this tag
        if: steps.create_tag.outputs.created == 'true'
        run: |
          pip install build
          python -m build

      - name: Upload the release distribution
        if: steps.create_tag.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  # The TestPyPI dry run needs its own pending publisher on test.pypi.org. It is
  # gated separately so the real publish is not blocked while that is absent.
  publish-testpypi:
    name: Publish to TestPyPI
    if: needs.auto-tag.outputs.created == 'true' && vars.ENABLE_TESTPYPI == 'true'
    needs: auto-tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/entrascope/
    steps:
      - name: Download the release distribution
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: always() && needs.auto-tag.outputs.created == 'true' && !contains(needs.*.result, 'failure')
    needs: [ auto-tag, publish-testpypi ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/entrascope/
    steps:
      - name: Download the release distribution
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/

      - name: List what will be published
        run: ls -la dist/

      # Publishing occasionally fails on a transient upstream error, most often
      # a 5xx from the Sigstore transparency log while generating attestations.
      # Three attempts with backoff, every one using the trusted publisher and
      # skip-existing so a partial upload is skipped rather than failing.
      - name: Publish, attempt 1
        id: publish1
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Back off before attempt 2
        if: steps.publish1.outcome == 'failure'
        run: echo "Attempt 1 failed, likely transient. Waiting 30 seconds." && sleep 30

      - name: Publish, attempt 2
        id: publish2
        if: steps.publish1.outcome == 'failure'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Back off before the final attempt
        if: steps.publish1.outcome == 'failure' && steps.publish2.outcome == 'failure'
        run: echo "Attempt 2 failed. Waiting 60 seconds before the last try." && sleep 60

      # Not continue-on-error: a persistent failure here is a real problem and
      # must fail the job.
      - name: Publish, attempt 3, final
        if: steps.publish1.outcome == 'failure' && steps.publish2.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  release:
    name: GitHub release
    if: needs.auto-tag.outputs.created == 'true'
    needs: [ auto-tag, publish-pypi ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the release distribution
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.auto-tag.outputs.tag }}" dist/* \
            --title "${{ needs.auto-tag.outputs.tag }}" \
            --generate-notes
