# Capability to prerequisite to remediation. Machine readable, and the source
# of the doctor report. entrascope.capabilities reads this file.

graph_permissions:
  - name: Application.Read.All
    app_role_id: 9a5d68dd-52b0-4cc2-bd40-abcf44ac3a30
    consent: admin
    required: true
    purpose: Read application registrations and service principals.
  - name: AuditLog.Read.All
    app_role_id: b0afded3-3588-46d8-8b3d-9842eff778da
    consent: admin
    required: true
    purpose: Read audit logs and sign in logs.
  - name: Directory.Read.All
    app_role_id: 7ab1d382-f21e-4acd-a863-ba3e13f7da61
    consent: admin
    required: true
    purpose: Read directory objects, owners and group assignments.
  - name: Policy.Read.All
    app_role_id: 246dd0d5-5bd0-4def-940b-0421030a5b68
    consent: admin
    required: true
    purpose: Read tenant consent and application management policies.
  - name: AppRoleAssignment.ReadWrite.All
    app_role_id: 06b708a9-e830-4db3-a914-8e69da51d44f
    consent: admin
    required: false
    privileged: true
    purpose: >
      Grant application role assignments. Excluded by default because it lets
      an application grant privileges to itself.

delegated_equivalents:
  # A delegated token carrying one of these acts as the signed in person, so
  # what it can read is decided by their directory roles rather than by the
  # scope names. Reporting the read permissions as missing in that case is
  # simply wrong, and sends the engineer to grant something they already have.
  - Directory.AccessAsUser.All
  - Directory.Read.All

directory_roles:
  # Used when the active authentication source is delegated, for example the
  # Azure CLI session, where directory roles apply instead of app roles.
  - name: Global Reader
    template_id: f2ef992c-3afb-46b9-b7cf-a126ee74c451
    sufficient: true
  - name: Security Reader
    template_id: 5d6b6bb7-de71-4623-b4af-96380a352509
    sufficient: partial
  - name: Reports Reader
    template_id: 4a5d8f65-41da-4de4-8968-e035b65339cf
    sufficient: partial

capabilities:
  - id: app_discovery
    requires:
      graph_permission: Application.Read.All
      licence: Free
    remediation: >
      Grant Application.Read.All to the application and record admin consent.
    docs_url: https://learn.microsoft.com/en-us/graph/permissions-reference

  - id: audit_logs_export
    requires:
      diagnostic_category: AuditLogs
      licence: Free
    remediation: >
      Enable a diagnostic setting that exports AuditLogs. The category
      ApplicationManagement covers application registration changes. Requires
      the Security Administrator role.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-diagnostic-settings-logs-options

  - id: signin_logs_export
    requires:
      diagnostic_category: SignInLogs
      licence: P1
    remediation: >
      Enable a diagnostic setting that exports SignInLogs to a Log Analytics
      workspace, event hub or storage account. Requires the Security
      Administrator role and an Entra ID P1 or P2 licence.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-diagnostic-settings-logs-options

  - id: non_interactive_signin_export
    requires:
      diagnostic_category: NonInteractiveUserSignInLogs
      licence: P1
    remediation: >
      Enable a diagnostic setting that exports NonInteractiveUserSignInLogs.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-diagnostic-settings-logs-options

  - id: service_principal_signin_export
    requires:
      diagnostic_category: ServicePrincipalSignInLogs
      licence: P1
    remediation: >
      Enable a diagnostic setting that exports ServicePrincipalSignInLogs.
      This is the category that shows client credentials flow failures.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-diagnostic-settings-logs-options

  - id: managed_identity_signin_export
    requires:
      diagnostic_category: ManagedIdentitySignInLogs
      licence: P1
    remediation: >
      Enable a diagnostic setting that exports ManagedIdentitySignInLogs.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-diagnostic-settings-logs-options

  - id: provisioning_logs_export
    requires:
      diagnostic_category: ProvisioningLogs
      licence: P1
    remediation: >
      Enable a diagnostic setting that exports ProvisioningLogs.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-diagnostic-settings-logs-options

  - id: graph_activity_logs
    requires:
      diagnostic_category: MicrosoftGraphActivityLogs
      licence: P1
    remediation: >
      Enable a diagnostic setting that exports MicrosoftGraphActivityLogs.
      Requires an Entra ID P1 or P2 tenant licence.
    docs_url: https://learn.microsoft.com/en-us/graph/microsoft-graph-activity-logs-overview

  - id: log_analytics_query
    requires:
      azure_role: Log Analytics Reader
    remediation: >
      Assign Log Analytics Reader on the workspace or its resource group to
      the identity entrascope authenticates as.
    docs_url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/manage-access

provisioning:
  # The vocabulary the entra-app-provisioner uses in its parameters schema, so
  # that an application can be read back in the same words it was created with
  # and the two compared. See parameters/parameters.schema.json in that
  # repository, and parameters/unity-deploy-resource.json for the Unity Deploy
  # wrapper around it.
  platform_types:
    - spa
    - web
    - publicClient

  # PROVISIONAL. These names were derived here, not taken from an authoritative
  # list. They follow the flow and client type naming that
  # OAuth2_authorize_code_confidential is an example of, and they cover the
  # shapes described by RFC 001 (single page application), RFC 002 (on behalf
  # of middle tier) and RFC 003 (AWS agent passwordless) in the provisioner
  # repository, together with the platform, exposedApi, obo and
  # federatedCredentials sections of its parameters schema.
  #
  # Replace the names below with the authoritative list when it is to hand.
  # Nothing but this file needs to change, and the status line is reported in
  # every inspection so that nobody mistakes a derived name for a settled one.
  app_type_vocabulary:
    status: provisional
    derived_from: >
      The provisioner parameters schema and RFCs 001 to 003, not an
      authoritative list. Replace the names in app_types and set status to
      authoritative.
  # Rules are tried in order and the first that matches wins, so the more
  # specific ones come first.
  app_types:
    - name: OAUTH2_CLIENT_CREDENTIALS_FEDERATED
      when: {federated: true}
      description: >
        Authenticates with a federated credential and no secret. This is the
        AWS agent passwordless shape in RFC 003.
    - name: OAUTH2_ON_BEHALF_OF_MIDDLE_TIER
      when: {exposes_api: true, known_client_applications: true}
      description: >
        Exposes an API and names the clients that may call through it, so it
        can exchange a caller token for a downstream one. RFC 002.
    - name: SAML2_SSO_GALLERY
      when: {sso_mode: saml, gallery: true}
      description: A gallery SAML application configured for single sign on.
    - name: SAML2_SSO_CUSTOM
      when: {sso_mode: saml}
      description: A SAML application configured by hand.
    - name: MANAGED_IDENTITY
      when: {service_principal_type: ManagedIdentity}
      description: >
        A managed identity, created by Azure alongside a resource rather than
        by an application provisioning pipeline.
    - name: LEGACY_SERVICE_PRINCIPAL
      when: {service_principal_type: Legacy}
      description: A service principal predating the current application model.
    - name: OAUTH2_AUTHORIZATION_CODE_PUBLIC_SPA
      when: {platform: spa}
      description: >
        A single page application using the authorization code flow with a
        proof key and holding no secret. RFC 001.
    - name: OAUTH2_AUTHORIZATION_CODE_CONFIDENTIAL
      when: {platform: web, credentials: any}
      description: >
        A web application using the authorization code flow and holding a
        secret or a certificate.
    - name: OAUTH2_AUTHORIZATION_CODE_PUBLIC_WEB
      when: {platform: web}
      description: >
        A web application registered with no credential, which can only use
        the authorization code flow as a public client.
    - name: OAUTH2_AUTHORIZATION_CODE_PUBLIC_NATIVE
      when: {platform: publicClient}
      description: A native, mobile or desktop client holding no secret.
    - name: OAUTH2_CLIENT_CREDENTIALS_CERTIFICATE
      when: {platform: none, credentials: certificate}
      description: >
        A daemon or service authenticating with a certificate and no user
        present.
    - name: OAUTH2_CLIENT_CREDENTIALS_SECRET
      when: {platform: none, credentials: secret}
      description: >
        A daemon or service authenticating with a shared secret and no user
        present.
    - name: OAUTH2_RESOURCE_API
      when: {platform: none, exposes_api: true}
      description: >
        An API that other applications call and that signs nobody in itself.
    - name: UNKNOWN
      when: {}
      description: >
        Nothing registered says how this application authenticates. It may be
        a placeholder, or configured somewhere other than the registration.
  # Shapes an application can have that the provisioner vocabulary does not
  # describe. Meeting one of these means the application was not created by
  # that pipeline, or was changed afterwards.
  outside_the_vocabulary:
    saml-gallery: >
      A gallery SAML application. The provisioner creates OAuth and OpenID
      Connect applications, not SAML single sign on.
    saml-non-gallery: >
      A SAML application configured by hand. The provisioner creates OAuth and
      OpenID Connect applications, not SAML single sign on.
    managed-identity: >
      A managed identity, created by Azure alongside a resource rather than by
      an application provisioning pipeline.
    legacy: >
      A legacy service principal, predating the application model the
      provisioner uses.

licences:
  # Service plan identifiers that indicate the Entra ID tier, read from
  # subscribedSkus. Reported as observed, never asserted as entitlement.
  p2_service_plans:
    - AAD_PREMIUM_P2
  p1_service_plans:
    - AAD_PREMIUM
  free_label: Free

# Which grant each part of the identity report needs. When a lookup is refused,
# the report names the permission that would have answered it, rather than only
# reporting the refusal.
lookup_permissions:
  tenant: Organization.Read.All, or Directory.Read.All
  signed_in_user: User.Read
  memberships: Directory.Read.All
  service_principal: Application.Read.All
  granted_permissions: Application.Read.All, or Directory.Read.All
  conditional_access: Policy.Read.All
  reachable_tenants: an Azure Resource Manager role on at least one subscription
