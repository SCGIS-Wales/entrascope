# The common logger. Read by entrascope.logger and nothing else.

level: INFO
format: human            # human or json
destination: stderr      # stderr, stdout or a file path

surfaces:
  cli:
    format: human
  mcp_stdio:
    format: json
    destination: stderr
  mcp_http:
    format: json
    destination: stdout

# Third party loggers that report the same failure we already report, in their
# own format. Quietened by default and restored by --verbose.
quiet_loggers:
  azure: ERROR
  azure.identity: ERROR
  azure.core: ERROR
  urllib3: WARNING
  httpx: WARNING
  # The server frameworks announce themselves in their own format. entrascope
  # already logs that the server is ready, with the canonical URI, as a JSON
  # line, and one format on one stream is the point.
  fastmcp: WARNING
  uvicorn: WARNING
  uvicorn.error: WARNING

context_fields:
  - correlation_id
  - auth_source
  - tenant_id

redaction:
  placeholder: "[redacted]"
  # Keys whose value is replaced wherever they appear in a logged structure.
  keys:
    - Secret
    - client_secret
    - clientSecret
    - password
    - access_token
    - refresh_token
    - id_token
    - assertion
    - client_assertion
    - authorization
    - Authorization
    - api_key
    - ARM_CLIENT_SECRET
  # Values matching these patterns are replaced wherever they appear.
  patterns:
    - name: bearer_token
      regex: "(?i)bearer\\s+[A-Za-z0-9._~+/-]+=*"
    - name: jwt
      regex: "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}"
    # A package index or a proxy address can carry a user name and a password,
    # and the installer echoes the address it was given.
    - name: url_credentials
      regex: "(?<=://)[^/\\s:@]+:[^/\\s@]+(?=@)"
    # A secret in a query string is a secret wherever the string came from.
    - name: query_secret
      regex: "(?i)\\b(client_secret|client_assertion|assertion|password|api[_-]?key|access_token|refresh_token|id_token)=[^&\\s\"']+"

update_check:
  # A version check must never slow a command down or stop it working. It is
  # cached, it has a short timeout, it is skipped when the output is going to a
  # machine, and any failure is silent.
  enabled: true
  interval_hours: 24
  timeout_seconds: 2
  cache_file: ~/.cache/entrascope/latest-release.json
  disable_variable: ENTRASCOPE_NO_UPDATE_CHECK
