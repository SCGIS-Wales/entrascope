# Projections from Microsoft Graph payloads onto entrascope data transfer
# objects. The left hand side is the DTO field, the right hand side is the
# Graph property path.

application:
  object_id: id
  app_id: appId
  display_name: displayName
  sign_in_audience: signInAudience
  identifier_uris: identifierUris
  created: createdDateTime
  notes: notes
  web_redirect_uris: web.redirectUris
  spa_redirect_uris: spa.redirectUris
  public_client_redirect_uris: publicClient.redirectUris
  requested_permissions: requiredResourceAccess
  password_credentials: passwordCredentials
  key_credentials: keyCredentials
  app_roles: appRoles
  oauth2_permission_scopes: api.oauth2PermissionScopes
  requested_access_token_version: api.requestedAccessTokenVersion
  known_client_applications: api.knownClientApplications
  group_membership_claims: groupMembershipClaims
  optional_claims: optionalClaims
  tags: tags
  notes: notes
  service_management_reference: serviceManagementReference
  publisher_domain: publisherDomain
  verified_publisher: verifiedPublisher.displayName
  disabled_by_microsoft: disabledByMicrosoftStatus
  # Whether Entra treats this as a public client when the request does not say.
  # A confidential client with this set true is refused with AADSTS700025 when
  # it presents a secret, and a native client with it false is refused with
  # AADSTS7000218 when it does not.
  is_fallback_public_client: isFallbackPublicClient
  # Set on a resource that accepts a claims mapping policy. A policy assigned
  # without this is ignored, which looks exactly like a policy that does not
  # work.
  accept_mapped_claims: api.acceptMappedClaims
  # Applications allowed to ask for this resource's scopes without a consent
  # prompt of their own. This is what makes an on behalf of chain work without
  # the user consenting to the middle tier separately.
  pre_authorized_applications: api.preAuthorizedApplications
  certification: certification
  application_template_id: applicationTemplateId
  service_principal_lock: servicePrincipalLockConfiguration

# One entry of preAuthorizedApplications: a client, and the scopes of this
# resource it may ask for without prompting.
pre_authorized_application:
  app_id: appId
  delegated_permission_ids: delegatedPermissionIds

service_principal:
  object_id: id
  app_id: appId
  display_name: displayName
  created: createdDateTime
  service_principal_type: servicePrincipalType
  sign_in_audience: signInAudience
  app_role_assignment_required: appRoleAssignmentRequired
  reply_urls: replyUrls
  identifier_uris: servicePrincipalNames
  preferred_single_sign_on_mode: preferredSingleSignOnMode
  password_credentials: passwordCredentials
  key_credentials: keyCredentials
  app_roles: appRoles
  oauth2_permission_scopes: oauth2PermissionScopes
  tags: tags
  account_enabled: accountEnabled
  app_owner_organization_id: appOwnerOrganizationId
  # Which certificate signs the SAML responses. With more than one signing
  # certificate on the object, this is the only thing that says which is in use.
  preferred_token_signing_key_thumbprint: preferredTokenSigningKeyThumbprint
  # Where Entra sends warning that the signing certificate is about to expire.
  # Empty here is why a SAML integration stops working with no warning at all.
  notification_email_addresses: notificationEmailAddresses
  # Where the service provider sends somebody to start sign in, which is what
  # makes an identity provider initiated flow work.
  login_url: loginUrl
  logout_url: logoutUrl
  # The public key issued tokens are encrypted with, where the application
  # requires encrypted assertions.
  token_encryption_key_id: tokenEncryptionKeyId
  saml_single_sign_on_settings: samlSingleSignOnSettings
  application_template_id: applicationTemplateId
  disabled_by_microsoft: disabledByMicrosoftStatus

# An app role assignment, which is one principal granted access to an
# enterprise application. Graph reports the same shape whether the principal is
# a user, a group or another service principal.
app_role_assignment:
  assignment_id: id
  principal_id: principalId
  principal_display_name: principalDisplayName
  principal_type: principalType
  app_role_id: appRoleId
  resource_display_name: resourceDisplayName
  created: createdDateTime

# A delegated permission grant, which is what recording consent produces.
oauth2_permission_grant:
  grant_id: id
  client_id: clientId
  resource_id: resourceId
  consent_type: consentType
  principal_id: principalId
  scope: scope

# A directory object an application or a person belongs to. A security group is
# the one that carries access, so its two flags are projected as well.
membership:
  object_id: id
  display_name: displayName
  odata_type: "@odata.type"
  description: description
  security_enabled: securityEnabled
  mail_enabled: mailEnabled
  membership_rule: membershipRule
  role_template_id: roleTemplateId
  on_premises_sync_enabled: onPremisesSyncEnabled

credential:
  key_id: keyId
  display_name: displayName
  start: startDateTime
  end: endDateTime
  usage: usage
  type: type

sign_in:
  id: id
  created: createdDateTime
  user_principal_name: userPrincipalName
  app_id: appId
  app_display_name: appDisplayName
  resource_display_name: resourceDisplayName
  client_app_used: clientAppUsed
  ip_address: ipAddress
  error_code: status.errorCode
  failure_reason: status.failureReason
  additional_details: status.additionalDetails
  conditional_access_status: conditionalAccessStatus
  correlation_id: correlationId

audit:
  id: id
  activity: activityDisplayName
  category: category
  result: result
  reason: resultReason
  activity_date_time: activityDateTime
  initiated_by: initiatedBy
  target_resources: targetResources
  correlation_id: correlationId

expiry:
  warning_days: 30

display:
  # How a value is rendered for a person. Nothing here changes the JSON, which
  # always carries the value exactly as Microsoft Graph gave it.
  timestamp:
    # Microsoft Graph reports to the nanosecond. Two decimal places are enough
    # to order two events and cost a third less of the column.
    decimals: 2
    # local, which converts to the machine's zone, or utc, which is what Graph
    # records. Either way the zone is named, so a timestamp is never ambiguous.
    # Local by default: somebody diagnosing a failure that happened twenty
    # minutes ago should not have to do the arithmetic to know that.
    zone: local
  # A guest account is reported as its whole home tenant address. The part
  # before the marker is the person, and the rest costs half a column.
  guest_marker: "#EXT#"
  # Columns that hold prose and may wrap. Everything else is kept on one line
  # and elided, because a value split across four lines cannot be read or
  # pasted.
  wrapping_columns:
    - detail
    - remediation
    - message
    - meaning
    - likely_cause
    - description
  # Values coloured by meaning, when the output is a terminal.
  colours:
    error: bold red
    FAIL: bold red
    failure: red
    expired: red
    warning: yellow
    expiring: yellow
    timeout: yellow
    note: dim
    pass: green
    success: green
    valid: green
  # The interactive chooser, which paints its own screen while it runs. The
  # colours below are chosen to be read on a dark terminal. A name may be one
  # of black, red, green, yellow, blue, magenta, cyan, white, any of those
  # prefixed with "bright", or one of the wider colours orange, amber, violet,
  # mint, slate and grey, which need a terminal with 256 colours and fall back
  # to the nearest of the eight when there are not.
  chooser:
    # "black" paints the chooser on black whatever the terminal is set to, so
    # the colours below always read the way they were chosen. "terminal" keeps
    # whatever background the terminal already has.
    background: black
    foreground: white
    # The line under the cursor.
    highlight: bright cyan
    # Headings, the count, and the help along the bottom.
    heading: bright cyan
    hint: slate
    # Colour by meaning. An application whose secret has expired cannot sign
    # in at all, which is why it is the loudest colour on the screen.
    tones:
      danger: bright red
      warning: amber
      oauth: orange
      saml: violet
      quiet: slate
  # The live view, which follows a tenant rather than reporting on it once.
  stream:
    # How often it asks for anything new. Entra writes an event to the audit
    # log within a minute or so of it happening, and asking more often than
    # this costs a call and answers nothing.
    interval_seconds: 20
    # How long a poll waits. A live view is answering the question "what is
    # happening now", so a call that has not answered in this long is better
    # abandoned and asked again than waited on for the whole of the transport
    # timeout, which is set for a report rather than for a screen.
    timeout_seconds: 15
    # How many of the newest events each poll asks for. Anything already seen
    # is discarded by identifier, so this only has to cover a single interval.
    poll_events: 50
    # How many lines the view keeps. Older ones fall off the bottom.
    maximum_rows: 2000
    # Sign in kinds the live view leaves out unless it is asked for one by
    # name. Azure signs its managed identities in constantly and none of it is
    # anybody's authentication problem. Pass --kind managed-identity to watch
    # them anyway.
    skip_kinds:
      - managed-identity
    # What each kind of line means, and so what colour it is drawn in.
    severity_tones:
      error: danger
      warning: warning
      note: quiet
      ok: ""

findings:
  # Rules the investigation applies. Thresholds and wording are configuration
  # so that a site can tighten them without a code change.
  audit_failure_results:
    - failure
    - timeout
  insecure_redirect_scheme: "http://"
  local_hosts:
    - localhost
    - 127.0.0.1
  no_owner:
    severity: warning
    detail: >
      The application has no owner, so nobody is named as responsible for it
      and nobody but a directory administrator can change it.
    remediation: >
      Add an owner with az ad app owner add, so that the application has a
      named custodian.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/howto-create-service-principal-portal
  insecure_redirect:
    severity: warning
    detail: >
      A redirect URI uses plain HTTP against a host that is not local, so an
      authorisation code can be intercepted.
    remediation: >
      Change the redirect URI to https, or remove it if it is no longer used.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reply-url
  assignment_required:
    severity: note
    detail: >
      The enterprise application requires assignment, so consent alone does not
      let a user sign in. A user or group must be assigned.
    remediation: >
      Assign the user or group, or set appRoleAssignmentRequired to false if
      the application should be open to the tenant.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/assign-user-or-group-access-portal
  disabled_principal:
    severity: error
    detail: >
      The enterprise application is disabled, so every sign in to it fails
      whatever else is configured.
    remediation: >
      Enable the service principal, or remove the application if it is retired.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/disable-user-sign-in-portal
  missing_admin_consent:
    severity: error
    detail: >
      The application registration asks for permissions that only an
      administrator may consent to, and no consent has been recorded for them.
      Every call that needs one of them is refused, whatever else is configured.
    remediation: >
      Record admin consent for the permissions named, with az ad app permission
      admin-consent, or from Enterprise applications, Permissions, Grant admin
      consent in the portal.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/grant-admin-consent
  user_consent_only:
    severity: warning
    detail: >
      A delegated permission was consented by one person for themselves rather
      than for the tenant. It works for them and is refused for everybody else,
      which is what a failure that only one engineer cannot reproduce looks
      like.
    remediation: >
      Record admin consent for the tenant if everyone should have the
      permission, or leave it as it is if consenting individually is deliberate.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-user-consent
  assignment_without_group:
    severity: note
    detail: >
      The enterprise application requires assignment and every assignment is to
      an individual person rather than to a group, so access has to be granted
      and revoked one person at a time.
    remediation: >
      Assign a security group instead, so that joining and leaving the group
      grants and revokes access.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/assign-user-or-group-access-portal
  confidential_client_marked_public:
    severity: error
    detail: >
      The application holds a credential and is also marked as a fallback
      public client. Entra then treats a token request that does not say which
      it is as coming from a public client and refuses the secret, which is
      AADSTS700025.
    remediation: >
      Set isFallbackPublicClient to false in the manifest, under Authentication,
      Allow public client flows, unless the application really does sign in
      without a secret.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/msal-client-application-configuration
  public_client_not_marked_public:
    severity: warning
    detail: >
      The application registers only public client redirect URIs, holds no
      credential, and is not marked as a fallback public client. A native or
      mobile client that cannot keep a secret is then refused for not sending
      one, which is AADSTS7000218.
    remediation: >
      Set isFallbackPublicClient to true in the manifest, under Authentication,
      Allow public client flows.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/msal-client-application-configuration
  saml_without_expiry_notification:
    severity: warning
    detail: >
      The enterprise application signs SAML assertions and no address is
      registered for expiry notification, so nobody is warned before the
      signing certificate expires and single sign on stops for everybody at
      once.
    remediation: >
      Add an address under Single sign on, SAML signing certificate,
      Notification Email Addresses.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/tutorial-manage-certificates-for-federated-single-sign-on
  claims_policy_without_accept_mapped_claims:
    severity: error
    detail: >
      A claims mapping policy is assigned and the application does not accept
      mapped claims, so Entra ignores the policy entirely. The token is issued
      without the mapped claims and nothing reports an error, which looks
      exactly like a policy that does not work.
    remediation: >
      Set acceptMappedClaims to true in the application manifest, or sign the
      token with a custom signing key.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/saml-claims-customization
  token_version_one:
    severity: note
    detail: >
      The application issues version 1.0 tokens. A resource server that expects
      the version 2.0 issuer and audience will reject them.
    remediation: >
      Set requestedAccessTokenVersion to 2 in the application manifest.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/access-tokens

classification:
  # Values Microsoft Graph reports, used to classify an application or an
  # enterprise application. Nothing here is hardcoded in src.

  # How requiredResourceAccess names the two kinds of permission. A Scope is a
  # delegated permission and a Role is an application permission.
  resource_access_types:
    delegated: Scope
    application: Role
  # How a delegated permission grant records who consented. AllPrincipals is
  # the whole tenant, which only an administrator can record. Principal is one
  # person consenting for themselves.
  consent_types:
    tenant_wide: AllPrincipals
    single_user: Principal
  # The value oauth2PermissionScopes carries when only an administrator may
  # consent to that scope. Anything else the signed in person may consent to
  # for themselves.
  admin_consent_scope_type: Admin
  # What Microsoft Graph calls a principal in an app role assignment.
  principal_types:
    user: User
    group: Group
    service_principal: ServicePrincipal
  # The object types a memberOf call returns. The key on the left is what this
  # tool calls each of them and appears in the output; the value is the OData
  # type Microsoft Graph reports.
  membership_types:
    group: "#microsoft.graph.group"
    directory-role: "#microsoft.graph.directoryRole"
    administrative-unit: "#microsoft.graph.administrativeUnit"
  # Which of those carries access, and so which one is worth pulling out of a
  # membership list on its own.
  access_bearing_membership: group
  # What this tool calls the policy that rewrites the claims in a token. It is
  # the one that is silently ignored unless the application accepts mapped
  # claims, which is worth saying out loud.
  claims_mapping_policy_kind: claims mapping
  # An app role assignment carrying this identifier grants no permission at
  # all. It records that the principal may use the application, nothing more,
  # which is how a user or a group is assigned to an enterprise application
  # that exposes no roles of its own.
  default_access_app_role_id: 00000000-0000-0000-0000-000000000000
  service_principal_types:
    managed_identity: ManagedIdentity
    application: Application
    legacy: Legacy
    social_identity_provider: SocialIdentityProvider
  single_sign_on_modes:
    saml: saml
    password: password
    oidc: notSupported
  gallery_tags:
    - WindowsAzureActiveDirectoryGalleryApplicationPrimaryV1
    - WindowsAzureActiveDirectoryGalleryApplicationNonPrimaryV1
  integrated_app_tag: WindowsAzureActiveDirectoryIntegratedApp
  credential_types:
    certificate: AsymmetricX509Cert
  # What Microsoft Graph calls a target, said the way this tool says it, so a
  # log line names the kind of object it changed.
  target_types:
    Application: application registration
    ServicePrincipal: enterprise application
    ServicePrincipalCredential: enterprise application credential
    User: user
    Group: group
    Policy: policy
    Device: device
    Other: object

  # Service principals owned by these tenants are Microsoft first party
  # applications. A tenant carries hundreds of them, almost all irrelevant to
  # diagnosing your own applications, so they are excluded unless asked for.
  # Types kept out of the chooser unless everything is asked for. Azure creates
  # a managed identity for each resource that needs one, and Defender creates
  # one per subscription, so a tenant can hold hundreds. Somebody choosing an
  # application to inspect is almost never after one of those, and a list they
  # cannot read down is a list that does not work.
  hidden_from_the_chooser:
    - managed-identity
  first_party_owner_tenants:
    - f8cdef31-a31e-4b4a-93e4-5f571e91255a
    - 72f988bf-86f1-41af-91ab-2d7cd011db47
  audiences:
    single_tenant: AzureADMyOrg
    multi_tenant: AzureADMultipleOrgs
    multi_tenant_and_personal: AzureADandPersonalMicrosoftAccount
    personal_only: PersonalMicrosoftAccount
