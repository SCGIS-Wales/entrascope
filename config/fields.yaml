# Projections from Microsoft Graph payloads onto entrascope data transfer
# objects. The left hand side is the DTO field, the right hand side is the
# Graph property path.

application:
  object_id: id
  app_id: appId
  display_name: displayName
  sign_in_audience: signInAudience
  identifier_uris: identifierUris
  created: createdDateTime
  notes: notes
  web_redirect_uris: web.redirectUris
  spa_redirect_uris: spa.redirectUris
  public_client_redirect_uris: publicClient.redirectUris
  requested_permissions: requiredResourceAccess
  password_credentials: passwordCredentials
  key_credentials: keyCredentials
  app_roles: appRoles
  oauth2_permission_scopes: api.oauth2PermissionScopes
  requested_access_token_version: api.requestedAccessTokenVersion
  known_client_applications: api.knownClientApplications
  group_membership_claims: groupMembershipClaims
  optional_claims: optionalClaims
  tags: tags
  notes: notes
  service_management_reference: serviceManagementReference
  publisher_domain: publisherDomain
  verified_publisher: verifiedPublisher.displayName
  disabled_by_microsoft: disabledByMicrosoftStatus

service_principal:
  object_id: id
  app_id: appId
  display_name: displayName
  created: createdDateTime
  service_principal_type: servicePrincipalType
  sign_in_audience: signInAudience
  app_role_assignment_required: appRoleAssignmentRequired
  reply_urls: replyUrls
  identifier_uris: servicePrincipalNames
  preferred_single_sign_on_mode: preferredSingleSignOnMode
  password_credentials: passwordCredentials
  key_credentials: keyCredentials
  app_roles: appRoles
  oauth2_permission_scopes: oauth2PermissionScopes
  tags: tags
  account_enabled: accountEnabled
  app_owner_organization_id: appOwnerOrganizationId

credential:
  key_id: keyId
  display_name: displayName
  start: startDateTime
  end: endDateTime
  usage: usage
  type: type

sign_in:
  id: id
  created: createdDateTime
  user_principal_name: userPrincipalName
  app_id: appId
  app_display_name: appDisplayName
  resource_display_name: resourceDisplayName
  client_app_used: clientAppUsed
  ip_address: ipAddress
  error_code: status.errorCode
  failure_reason: status.failureReason
  additional_details: status.additionalDetails
  conditional_access_status: conditionalAccessStatus

audit:
  id: id
  activity: activityDisplayName
  category: category
  result: result
  reason: resultReason
  activity_date_time: activityDateTime
  initiated_by: initiatedBy
  target_resources: targetResources

expiry:
  warning_days: 30

display:
  # How a value is rendered for a person. Nothing here changes the JSON, which
  # always carries the value exactly as Microsoft Graph gave it.
  timestamp:
    # Microsoft Graph reports to the nanosecond. Two decimal places are enough
    # to order two events and cost a third less of the column.
    decimals: 2
    # local, which converts to the machine's zone, or utc, which is what Graph
    # records. Either way the zone is named, so a timestamp is never ambiguous.
    # Local by default: somebody diagnosing a failure that happened twenty
    # minutes ago should not have to do the arithmetic to know that.
    zone: local
  # A guest account is reported as its whole home tenant address. The part
  # before the marker is the person, and the rest costs half a column.
  guest_marker: "#EXT#"
  # Columns that hold prose and may wrap. Everything else is kept on one line
  # and elided, because a value split across four lines cannot be read or
  # pasted.
  wrapping_columns:
    - detail
    - remediation
    - message
    - meaning
    - likely_cause
    - description
  # Values coloured by meaning, when the output is a terminal.
  colours:
    error: bold red
    FAIL: bold red
    failure: red
    expired: red
    warning: yellow
    expiring: yellow
    timeout: yellow
    note: dim
    pass: green
    success: green
    valid: green
  # The interactive chooser, which paints its own screen while it runs. The
  # colours below are chosen to be read on a dark terminal. A name may be one
  # of black, red, green, yellow, blue, magenta, cyan, white, any of those
  # prefixed with "bright", or one of the wider colours orange, amber, violet,
  # mint, slate and grey, which need a terminal with 256 colours and fall back
  # to the nearest of the eight when there are not.
  chooser:
    # "black" paints the chooser on black whatever the terminal is set to, so
    # the colours below always read the way they were chosen. "terminal" keeps
    # whatever background the terminal already has.
    background: black
    foreground: white
    # The line under the cursor.
    highlight: bright cyan
    # Headings, the count, and the help along the bottom.
    heading: bright cyan
    hint: slate
    # Colour by meaning. An application whose secret has expired cannot sign
    # in at all, which is why it is the loudest colour on the screen.
    tones:
      danger: bright red
      warning: amber
      oauth: orange
      saml: violet
      quiet: slate
  # The live view, which follows a tenant rather than reporting on it once.
  stream:
    # How often it asks for anything new. Entra writes an event to the audit
    # log within a minute or so of it happening, and asking more often than
    # this costs a call and answers nothing.
    interval_seconds: 20
    # How long a poll waits. A live view is answering the question "what is
    # happening now", so a call that has not answered in this long is better
    # abandoned and asked again than waited on for the whole of the transport
    # timeout, which is set for a report rather than for a screen.
    timeout_seconds: 15
    # How many of the newest events each poll asks for. Anything already seen
    # is discarded by identifier, so this only has to cover a single interval.
    poll_events: 50
    # How many lines the view keeps. Older ones fall off the bottom.
    maximum_rows: 2000
    # Sign in kinds the live view leaves out unless it is asked for one by
    # name. Azure signs its managed identities in constantly and none of it is
    # anybody's authentication problem. Pass --kind managed-identity to watch
    # them anyway.
    skip_kinds:
      - managed-identity
    # What each kind of line means, and so what colour it is drawn in.
    severity_tones:
      error: danger
      warning: warning
      note: quiet
      ok: ""

findings:
  # Rules the investigation applies. Thresholds and wording are configuration
  # so that a site can tighten them without a code change.
  audit_failure_results:
    - failure
    - timeout
  insecure_redirect_scheme: "http://"
  local_hosts:
    - localhost
    - 127.0.0.1
  no_owner:
    severity: warning
    detail: >
      The application has no owner, so nobody is named as responsible for it
      and nobody but a directory administrator can change it.
    remediation: >
      Add an owner with az ad app owner add, so that the application has a
      named custodian.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/howto-create-service-principal-portal
  insecure_redirect:
    severity: warning
    detail: >
      A redirect URI uses plain HTTP against a host that is not local, so an
      authorisation code can be intercepted.
    remediation: >
      Change the redirect URI to https, or remove it if it is no longer used.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reply-url
  assignment_required:
    severity: note
    detail: >
      The enterprise application requires assignment, so consent alone does not
      let a user sign in. A user or group must be assigned.
    remediation: >
      Assign the user or group, or set appRoleAssignmentRequired to false if
      the application should be open to the tenant.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/assign-user-or-group-access-portal
  disabled_principal:
    severity: error
    detail: >
      The enterprise application is disabled, so every sign in to it fails
      whatever else is configured.
    remediation: >
      Enable the service principal, or remove the application if it is retired.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/disable-user-sign-in-portal
  token_version_one:
    severity: note
    detail: >
      The application issues version 1.0 tokens. A resource server that expects
      the version 2.0 issuer and audience will reject them.
    remediation: >
      Set requestedAccessTokenVersion to 2 in the application manifest.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/access-tokens

classification:
  # Values Microsoft Graph reports, used to classify an application or an
  # enterprise application. Nothing here is hardcoded in src.
  service_principal_types:
    managed_identity: ManagedIdentity
    application: Application
    legacy: Legacy
    social_identity_provider: SocialIdentityProvider
  single_sign_on_modes:
    saml: saml
    password: password
    oidc: notSupported
  gallery_tags:
    - WindowsAzureActiveDirectoryGalleryApplicationPrimaryV1
    - WindowsAzureActiveDirectoryGalleryApplicationNonPrimaryV1
  integrated_app_tag: WindowsAzureActiveDirectoryIntegratedApp
  credential_types:
    certificate: AsymmetricX509Cert
  # What Microsoft Graph calls a target, said the way this tool says it, so a
  # log line names the kind of object it changed.
  target_types:
    Application: application registration
    ServicePrincipal: enterprise application
    ServicePrincipalCredential: enterprise application credential
    User: user
    Group: group
    Policy: policy
    Device: device
    Other: object

  # Service principals owned by these tenants are Microsoft first party
  # applications. A tenant carries hundreds of them, almost all irrelevant to
  # diagnosing your own applications, so they are excluded unless asked for.
  # Types kept out of the chooser unless everything is asked for. Azure creates
  # a managed identity for each resource that needs one, and Defender creates
  # one per subscription, so a tenant can hold hundreds. Somebody choosing an
  # application to inspect is almost never after one of those, and a list they
  # cannot read down is a list that does not work.
  hidden_from_the_chooser:
    - managed-identity
  first_party_owner_tenants:
    - f8cdef31-a31e-4b4a-93e4-5f571e91255a
    - 72f988bf-86f1-41af-91ab-2d7cd011db47
  audiences:
    single_tenant: AzureADMyOrg
    multi_tenant: AzureADMultipleOrgs
    multi_tenant_and_personal: AzureADandPersonalMicrosoftAccount
    personal_only: PersonalMicrosoftAccount
