# Authentication and authorisation error codes mapped to remediation.
# entrascope.errors reads this file and never hardcodes a code or a URL.

defaults:
  meaning: Unrecognised error code.
  remediation: >
    Look the code up in the Microsoft identity platform error code reference
    and check the sign in log entry for the correlation id and the client
    application.
  docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

errors:
  AADSTS7000215:
    meaning: Invalid client secret provided.
    likely_cause: >
      The secret value is wrong, or the Secret ID was used instead of the
      secret value.
    remediation: >
      Create a new client secret and use the secret value, not the Secret ID.
      Update the credential file and confirm its mode is 0600.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  AADSTS7000222:
    meaning: The provided client secret keys are expired.
    likely_cause: The secret passed its endDateTime.
    remediation: >
      Create a new client secret and rotate the credential file. Run
      entrascope discover apps to list every credential approaching expiry.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  AADSTS700016:
    meaning: Application not found in the tenant.
    likely_cause: >
      The ClientID belongs to another tenant, or the application registration
      was deleted.
    remediation: >
      Verify the ClientID and TenantID, and confirm the application
      registration exists in this tenant.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  AADSTS50011:
    meaning: Redirect URI or reply URL mismatch.
    likely_cause: >
      The redirect URI sent by the client is not registered, or differs by
      case, scheme or a trailing slash.
    remediation: >
      Add the exact redirect URI, byte for byte, to the application
      registration. Comparison is case sensitive and trailing slash sensitive.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  AADSTS650057:
    meaning: >
      Invalid resource. The client requested a resource that is not listed in
      its API permissions.
    likely_cause: The target resource is missing from the required resource access list.
    remediation: >
      Add the target resource to the required API permissions of the client
      application and grant admin consent.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  AADSTS90094:
    meaning: An administrator has set a policy preventing user consent.
    likely_cause: The tenant restricts user consent to applications.
    remediation: >
      Request admin consent for the application, or adjust the user consent
      policy for the tenant.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/grant-admin-consent

  AADSTS500011:
    meaning: Resource principal not found in the tenant.
    likely_cause: >
      The service principal for the resource is not provisioned in the tenant,
      consent was never granted, or the request went to the wrong tenant.
    remediation: >
      Ensure the resource service principal exists and is consented, and
      confirm the tenant in the request.
    docs_url: https://learn.microsoft.com/en-us/troubleshoot/entra/entra-id/app-integration/error-code-aadsts500011-resource-principal-not-found

  AADSTS65001:
    meaning: The user or administrator has not consented to use the application.
    likely_cause: Consent was never granted for the requested permissions.
    remediation: >
      Grant admin consent, or send an interactive consent request to the user.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/grant-admin-consent

  Authorization_RequestDenied:
    meaning: Insufficient privileges to complete the operation.
    likely_cause: >
      The calling identity lacks the required Microsoft Graph application
      permission, or the required directory role.
    remediation: >
      Grant the required Graph application permission and admin consent, or
      assign the needed directory role. Run entrascope doctor to see which
      permission is missing.
    docs_url: https://learn.microsoft.com/en-us/graph/permissions-reference

  Application_ReadWrite_OwnedBy_Insufficient:
    meaning: >
      Application.ReadWrite.OwnedBy allows writes only to applications the
      calling service principal owns.
    likely_cause: >
      The operation targets an application the caller does not own, or the
      operation adds an owner, which OwnedBy never permits.
    remediation: >
      Add the caller as an owner of the target application, or grant
      Application.ReadWrite.All. Adding another owner always requires
      Application.ReadWrite.All.
    docs_url: https://learn.microsoft.com/en-us/graph/permissions-reference

  Users_Cannot_Register_Applications:
    meaning: >
      The tenant setting "Users can register applications" is set to No.
    likely_cause: >
      A non privileged user attempted to create an application registration in
      a tenant that restricts registration.
    remediation: >
      Ask an administrator to create the registration, assign the Application
      Developer role to the user, or change the tenant setting.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/delegate-app-roles

  Restricted_Management_Administrative_Unit:
    meaning: >
      The target object belongs to a restricted management administrative unit.
    likely_cause: >
      Tenant level directory roles are blocked from modifying objects inside a
      restricted management administrative unit.
    remediation: >
      Obtain a role assignment scoped to the administrative unit that contains
      the object.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/admin-units-restricted-management

  Authentication_RequestFromNonPremiumTenantOrB2CTenant:
    meaning: >
      The sign in log endpoint refused the request because the tenant has no
      Entra ID premium licence.
    likely_cause: >
      Reading sign in logs, whether through Microsoft Graph or through a Log
      Analytics workspace, requires Entra ID P1 or P2. Audit logs are readable
      on any tier.
    remediation: >
      Read the audit logs instead, which need no premium licence, or assign an
      Entra ID P1 or P2 licence to the tenant. Run entrascope doctor to see the
      tier the tenant reports.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-sign-ins

  Request_UnsupportedQuery:
    meaning: >
      The endpoint refused a query parameter, most often a custom page size.
    likely_cause: >
      A few Microsoft Graph collections reject $top. entrascope names those in
      configuration and omits the parameter for them.
    remediation: >
      Add the endpoint to paging.no_page_size in config/retry.yaml so that no
      page size is sent to it.
    docs_url: https://learn.microsoft.com/en-us/graph/query-parameters

  Missing_Admin_Consent:
    meaning: An application permission was added but never consented.
    likely_cause: >
      az ad app permission add records the requirement, it does not grant it.
    remediation: >
      Run az ad app permission admin-consent for the application, or grant
      consent in the portal under API permissions.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/grant-admin-consent

  # ----------------------------------------------------------------------
  # OAuth 2.0 and OpenID Connect
  # ----------------------------------------------------------------------

  AADSTS50194:
    meaning: >
      The application is registered for a single tenant but the request went to
      the common endpoint.
    likely_cause: >
      A single tenant application must authenticate against its own tenant.
      The common and organizations endpoints are for multi tenant applications.
    remediation: >
      Send the request to https://login.microsoftonline.com/{tenant}/ instead
      of /common/, or change the sign in audience of the registration to
      AzureADMultipleOrgs.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/howto-convert-app-to-be-multi-tenant

  AADSTS50105:
    meaning: >
      The signed in user is not assigned to a role for the application.
    likely_cause: >
      The enterprise application requires assignment, and this user or their
      groups have not been assigned. Consent alone does not grant access.
    remediation: >
      Assign the user or a group they belong to, or set the assignment
      requirement to false if the application should be open to the tenant.
      Run entrascope investigate to see the assignment requirement.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/assign-user-or-group-access-portal

  AADSTS7000112:
    meaning: The application is disabled.
    likely_cause: >
      The service principal has accountEnabled set to false, so every sign in
      to it fails whatever else is configured.
    remediation: >
      Enable the enterprise application, or remove it if it is retired. Run
      entrascope discover enterprise-apps to see which are disabled.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/disable-user-sign-in-portal

  AADSTS7000218:
    meaning: >
      The request body must contain either client_assertion or client_secret.
    likely_cause: >
      A confidential client authenticated with neither a secret nor a
      certificate assertion, often because the client was configured as public.
    remediation: >
      Send the client secret, or a signed client assertion, or configure the
      application as a public client if it genuinely holds no credential.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-client-creds-grant-flow

  AADSTS700027:
    meaning: Client assertion validation failed.
    likely_cause: >
      The certificate that signed the assertion is not registered on the
      application, has expired, or the assertion itself is malformed or past
      its lifetime.
    remediation: >
      Register the signing certificate on the application, check its expiry
      with entrascope discover applications --expiring, and confirm the
      assertion audience and lifetime.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/certificate-credentials

  AADSTS700051:
    meaning: >
      The response type token is not enabled for the application.
    likely_cause: >
      An implicit flow was requested and the registration does not allow it.
    remediation: >
      Use the authorization code flow with PKCE, which is what a single page
      application should use, or enable the implicit grant on the registration
      if a legacy client genuinely needs it.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow

  AADSTS700082:
    meaning: The refresh token has expired because of inactivity.
    likely_cause: The token was not used within its inactivity window.
    remediation: Sign in again to obtain a new refresh token.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/refresh-tokens

  AADSTS650053:
    meaning: The application asked for a scope the resource does not expose.
    likely_cause: >
      The scope name is wrong, or it is defined on a different resource, or the
      resource exposes it under a different application id URI.
    remediation: >
      Check the scopes the resource exposes under Expose an API and request one
      of those. Run entrascope inspect on the resource to list them.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/scopes-oidc

  AADSTS650052:
    meaning: >
      The application needs access to a service that the organisation has not
      subscribed to or enabled.
    likely_cause: >
      A permission was requested for a first party service the tenant does not
      have, or the resource service principal is not provisioned.
    remediation: >
      Subscribe to or enable the service, or remove the permission from the
      application.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  AADSTS9002325:
    meaning: >
      A single page application must use the authorization code flow with
      PKCE rather than the implicit flow.
    likely_cause: >
      The redirect URI is registered on the single page application platform
      and the request asked for an implicit grant, or a cross origin token
      request was made without PKCE.
    remediation: >
      Use the authorization code flow with a code challenge, and register the
      redirect URI on the single page application platform.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow

  AADSTS9002313:
    meaning: The request is malformed or invalid.
    likely_cause: >
      A required parameter is missing or misspelled, or a value was sent that
      the endpoint does not accept.
    remediation: >
      Compare the request against the reference for the flow in use. The
      correlation id in the response identifies the request in the sign in
      logs.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow

  AADSTS90002:
    meaning: The tenant was not found.
    likely_cause: >
      The tenant identifier or domain in the authority is wrong, or the tenant
      has been deleted.
    remediation: >
      Check the tenant id or domain in the authority URL. Run entrascope whoami
      to see the tenant this tool is querying.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  AADSTS53003:
    meaning: Access was blocked by a conditional access policy.
    likely_cause: >
      A policy applies to this user, application or device and its conditions
      were not met.
    remediation: >
      Find the policy in the sign in log entry for the correlation id. Run
      entrascope whoami to list the conditional access policies in the tenant.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/troubleshoot-conditional-access

  AADSTS50076:
    meaning: Multifactor authentication is required.
    likely_cause: >
      A policy requires a second factor, and the flow in use cannot prompt for
      one. A client credentials flow never can.
    remediation: >
      Use a flow that can prompt, or exclude the application from the policy if
      it runs unattended, or use a workload identity.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfa-howitworks

  AADSTS50058:
    meaning: A silent sign in request was sent but there is no signed in user.
    likely_cause: The browser session has expired or was never established.
    remediation: Fall back to an interactive sign in.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  AADSTS50020:
    meaning: >
      The user account is from an identity provider that this tenant does not
      accept, or the account does not exist here.
    likely_cause: >
      A personal account signed in to a single tenant application, or a guest
      was never invited.
    remediation: >
      Invite the user as a guest, or change the sign in audience of the
      application to accept the account type.
    docs_url: https://learn.microsoft.com/en-us/troubleshoot/entra/entra-id/app-integration/error-code-aadsts50020-user-account-identity-provider-does-not-exist

  AADSTS500341:
    meaning: The user account has been deleted.
    likely_cause: The account was removed while a token was still in use.
    remediation: >
      Use a different account, or restore the deleted user within the recovery
      window.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  # ----------------------------------------------------------------------
  # SAML single sign on
  # ----------------------------------------------------------------------

  AADSTS75005:
    meaning: The request is not a valid SAML 2.0 protocol message.
    likely_cause: >
      The service provider sent something the endpoint could not parse, often a
      SAML 1.1 message, an unsupported binding, or a malformed request.
    remediation: >
      Confirm the service provider is configured for SAML 2.0 and check the
      binding it uses. Compare its metadata against the enterprise application.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/troubleshoot-saml-based-single-sign-on

  AADSTS750054:
    meaning: >
      The request carried no SAMLRequest or SAMLResponse parameter.
    likely_cause: >
      The service provider posted to the wrong endpoint, or a redirect lost the
      parameter.
    remediation: >
      Point the service provider at the sign on URL published in the enterprise
      application, and confirm the binding.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/troubleshoot-saml-based-single-sign-on

  AADSTS7500514:
    meaning: >
      A supported response type was not found in the SAML request.
    likely_cause: >
      The service provider asked for a response type the endpoint does not
      issue.
    remediation: >
      Check the assertion consumer service configuration on the service
      provider side.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/troubleshoot-saml-based-single-sign-on

  AADSTS75011:
    meaning: >
      The authentication method the user used does not match the one the
      application requested.
    likely_cause: >
      The service provider asked for a specific authentication context, and the
      existing session was established another way.
    remediation: >
      Remove the authentication context requirement from the service provider,
      or make the user re-authenticate with the method it asks for.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/troubleshoot-saml-based-single-sign-on

  AADSTS50107:
    meaning: The requested federation realm object was not found.
    likely_cause: >
      The identifier the service provider sent does not match any identifier
      URI on the enterprise application.
    remediation: >
      Add the exact entity id the service provider sends to the identifier URIs
      of the enterprise application. Run entrascope inspect on it to see the
      identifiers currently set.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-saml-single-sign-on

  AADSTS51004:
    meaning: The user account does not exist in the directory.
    likely_cause: >
      The name identifier the service provider expects does not resolve to a
      user here, often because the claim maps to the wrong attribute.
    remediation: >
      Check the name identifier claim mapping on the enterprise application
      against what the service provider expects.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-claims-mapping

  AADSTS50008:
    meaning: The SAML assertion is missing or misconfigured.
    likely_cause: >
      A federated identity provider did not return an assertion, or the
      assertion could not be validated.
    remediation: >
      Check the federation configuration and the signing certificate on both
      sides.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/troubleshoot-saml-based-single-sign-on

  AADSTS5002710:
    meaning: The client assertion could not be read.
    likely_cause: >
      The assertion is not a well formed JSON web token. A missing or wrong
      header, an unsigned token, or a value sent in the wrong parameter.
    remediation: >
      Send a token signed with the certificate registered on the application,
      with an x5t header carrying that certificate thumbprint, an audience of
      the token endpoint and an issuer and subject of the client id.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/certificate-credentials

  AADSTS700024:
    meaning: The client assertion is not within its validity window.
    likely_cause: >
      The nbf or exp claim is wrong, often because the clock on the machine
      that signed it is out.
    remediation: >
      Set nbf to now and exp within ten minutes of it, and check the clock.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/certificate-credentials

  Microsoft.Online.Workflows.ValidationException:
    meaning: The directory refused the change because it is not valid.
    likely_cause: >
      A property was set on a service principal that must match its
      application, or a value broke a rule the directory enforces. Reply URLs
      and identifier URIs belong on the application, and the service principal
      follows.
    remediation: >
      Make the change on the application registration rather than on the
      enterprise application. Run entrascope inspect on it to see which
      properties each object holds.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/app-objects-and-service-principals

  Microsoft.Online.Workflows.EntitlementValidationException:
    meaning: >
      The directory refused the change because the tenant is not entitled to
      the feature it needs.
    likely_cause: >
      Configuring SAML single sign on, or another feature gated by licence, on
      a tenant without the licence that allows it. Entra ID Free allows a
      limited number of applications with SAML single sign on.
    remediation: >
      Check the licence tier with entrascope doctor. Assign an Entra ID P1 or
      P2 licence, or make the change in a tenant that has one.
    docs_url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on

  # ----------------------------------------------------------------------
  # Microsoft Graph
  # ----------------------------------------------------------------------

  # ----------------------------------------------------------------------
  # The network, before any service was reached
  # ----------------------------------------------------------------------

  ConnectionFailed:
    meaning: The service could not be reached at all.
    likely_cause: >
      No route, a name that does not resolve, or a firewall or proxy refusing
      the connection.
    remediation: >
      Check the network path with entrascope doctor, which reports the proxy
      and the certificate authority in force. Behind a corporate proxy set
      HTTPS_PROXY, and NO_PROXY for the addresses that bypass it.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  TlsFailure:
    meaning: The TLS handshake failed.
    likely_cause: >
      A proxy inspecting TLS presents its own certificate, and the certificate
      authority that signed it is not trusted here.
    remediation: >
      Point ENTRASCOPE_CA_BUNDLE, REQUESTS_CA_BUNDLE or SSL_CERT_FILE at the
      certificate authority bundle your organisation uses. Run entrascope
      doctor to see which one is in force.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  ProxyFailure:
    meaning: The proxy refused or could not complete the connection.
    likely_cause: >
      The proxy address is wrong, it requires authentication, or it does not
      allow the destination.
    remediation: >
      Check HTTPS_PROXY and NO_PROXY. Run entrascope doctor, which reports the
      proxy it is using.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  ConnectTimeout:
    meaning: The connection was not established within the timeout.
    likely_cause: A firewall dropping the packets, or a slow or absent route.
    remediation: >
      Confirm the address is reachable from here. The timeout is
      connect_timeout_seconds in config/retry.yaml.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  ReadTimeout:
    meaning: The service accepted the connection and then did not answer in time.
    likely_cause: >
      A slow query, most often a wide log query, or a service under load.
    remediation: >
      Narrow the query with --hours or --limit, or raise
      read_timeout_seconds in config/retry.yaml.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  UndecodableBody:
    meaning: The reply was not JSON.
    likely_cause: >
      A proxy or a captive portal answering in place of the service, usually
      with a sign in page.
    remediation: >
      Check the proxy configuration. entrascope doctor reports the proxy in
      force.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes

  Request_ResourceNotFound:
    meaning: The object named in the request does not exist.
    likely_cause: >
      An identifier is wrong, the object was deleted, or the caller cannot see
      it and Graph reports absence rather than refusal.
    remediation: >
      Confirm the identifier. A deleted application can be restored from the
      deleted items within thirty days.
    docs_url: https://learn.microsoft.com/en-us/graph/errors

  Authorization_IdentityNotFound:
    meaning: The identity making the request could not be resolved.
    likely_cause: >
      The service principal for the application does not exist in this tenant,
      even though the application registration does.
    remediation: >
      Create the service principal with az ad sp create --id <app-id>.
    docs_url: https://learn.microsoft.com/en-us/entra/identity-platform/app-objects-and-service-principals
