# Log Analytics table names and the Entra diagnostic setting categories that
# populate them. Nothing here may be hardcoded in src.

diagnostic_categories:
  - name: AuditLogs
    table: AuditLogs
    minimum_licence: Free
    description: Directory changes, including application registration changes.
  - name: SignInLogs
    table: SigninLogs
    minimum_licence: P1
    description: Interactive user sign ins.
  - name: NonInteractiveUserSignInLogs
    table: AADNonInteractiveUserSignInLogs
    minimum_licence: P1
    description: Non interactive user sign ins, including refresh token use.
  - name: ServicePrincipalSignInLogs
    table: AADServicePrincipalSignInLogs
    minimum_licence: P1
    description: Application sign ins using the client credentials flow.
  - name: ManagedIdentitySignInLogs
    table: AADManagedIdentitySignInLogs
    minimum_licence: P1
    description: Managed identity token acquisitions.
  - name: ProvisioningLogs
    table: AADProvisioningLogs
    minimum_licence: P1
    description: Application provisioning activity.
  - name: MicrosoftGraphActivityLogs
    table: MicrosoftGraphActivityLogs
    minimum_licence: P1
    description: Every Microsoft Graph request made against the tenant.

audit_categories:
  # Every directory audit category worth asking for by name. The left hand side
  # is what entrascope calls it on the command line, the right hand side is the
  # value Microsoft Graph records in the category property. Add a row here and
  # entrascope logs audit --category accepts it; nothing in src changes.
  application-management: ApplicationManagement
  user-management: UserManagement
  group-management: GroupManagement
  role-management: RoleManagement
  policy: Policy
  directory-management: DirectoryManagement
  device-management: DeviceManagement
  resource-management: ResourceManagement
  authorisation: Authorization
  # Every category. Selected by name like the rest, and it sends no category
  # clause at all rather than a clause naming a category that does not exist.
  all: ""

# The category asked for when none is named. Application management is where
# changes to application registrations and enterprise applications are
# recorded, which is what this tool exists to diagnose.
default_audit_category: application-management

# Applied to every sign in kind. Written once here rather than repeated under
# each kind, because they are the same property names whichever kind is asked
# for, and a value repeated four times is a value that will disagree with
# itself eventually.
sign_in_filters:
  # Narrows to one application at Microsoft Graph. Applied after the rows
  # arrive it could only narrow the newest rows, so an application that last
  # signed in an hour ago would look like one that never has.
  graph_app_template: "appId eq '{app_id}'"
  # Narrows to a period, for the same reason.
  graph_since_template: "createdDateTime ge {since}"
  # Keeps only the sign ins that failed. Status zero is success.
  graph_failures_filter: "status/errorCode ne 0"
  # Newest first. A log read without an order is a log read in whatever order
  # the service felt like.
  graph_order_by: "createdDateTime desc"

sign_in_kinds:
  # OData filters for the Graph reporting API, and the KQL template that
  # answers the same question through Azure Monitor. Graph reports every sign
  # in kind from one endpoint, distinguished by signInEventTypes. Azure Monitor
  # holds each kind in a table of its own, which is the diagnostic_category
  # below, so the template is given the table to read rather than naming one.
  interactive:
    # The version 1.0 signIns endpoint returns interactive sign ins and does
    # not carry the signInEventTypes property, so no filter is sent.
    graph_filter: ""
    graph_beta: false
    diagnostic_category: SignInLogs
    kql_template: signins
  non-interactive:
    # signInEventTypes exists on the beta endpoint only.
    graph_beta: true
    graph_filter: "signInEventTypes/any(t: t eq 'nonInteractiveUser')"
    diagnostic_category: NonInteractiveUserSignInLogs
    kql_template: signins
  service-principal:
    # signInEventTypes exists on the beta endpoint only.
    graph_beta: true
    graph_filter: "signInEventTypes/any(t: t eq 'servicePrincipal')"
    diagnostic_category: ServicePrincipalSignInLogs
    kql_template: signins
  managed-identity:
    # signInEventTypes exists on the beta endpoint only.
    graph_beta: true
    graph_filter: "signInEventTypes/any(t: t eq 'managedIdentity')"
    diagnostic_category: ManagedIdentitySignInLogs
    kql_template: signins

log_queries:
  # Filters and templates for the other log sources.
  audit:
    graph_filter_template: "category eq '{category}'"
    # How far back to look, applied at Microsoft Graph rather than after the
    # rows arrive. Without it a lookback narrows nothing and the newest rows
    # come back whatever period was asked for.
    graph_since_template: "activityDateTime ge {since}"
    # One application, matched at Microsoft Graph on the object it changed. A
    # filter applied after the rows arrive can only narrow the newest rows,
    # which is why an application changed last month looks like one that was
    # never changed at all.
    graph_target_template: "targetResources/any(t: t/id eq '{target}')"
    # What to sort by, newest first. A log read without an order is a log read
    # in whatever order the service felt like.
    graph_order_by: "activityDateTime desc"
    diagnostic_category: AuditLogs
    kql_template: audit_events
  graph-activity:
    graph_filter_template: ""
    diagnostic_category: MicrosoftGraphActivityLogs
    kql_template: graph_activity
    graph_supported: false
  provisioning:
    graph_filter_template: ""
    diagnostic_category: ProvisioningLogs
    kql_template: ""

# Set this once and the monitor route stops asking for --workspace.
workspace_id: ""

defaults:
  lookback_hours: 24
  # Deliberately small. A log listing is for reading, and a wall of rows is
  # not. Raise it with --limit when you want the lot, or use --output plain and
  # pipe it somewhere that can hold it.
  row_limit: 25
  # Ceilings, because a row limit reaches a KQL query as a number and a query
  # for ten million rows is a way to hang a terminal rather than to read a log.
  # A request above these is brought down to them and says so.
  max_row_limit: 10000
  max_lookback_hours: 720
