# Transport behaviour. Consumed by entrascope.http when it builds the session
# and by the threaded fan out in entrascope.graph.

http:
  connect_timeout_seconds: 10
  read_timeout_seconds: 60
  user_agent: entrascope/{version} (+https://github.com/SCGIS-Wales/entrascope)
  pool_connections: 16
  pool_maxsize: 32

retry:
  total: 5
  connect: 3
  read: 3
  status: 5
  backoff_factor: 0.5
  backoff_max_seconds: 60
  respect_retry_after_header: true
  status_forcelist: [429, 500, 502, 503, 504]
  allowed_methods: [GET, HEAD, OPTIONS]

network:
  # Forward web proxies and certificate trust. Every variable name is
  # configuration so that a site with different conventions can add its own.
  trust_environment: true
  verify_tls: true
  proxy_variables:
    - HTTPS_PROXY
    - https_proxy
    - HTTP_PROXY
    - http_proxy
    - ALL_PROXY
    - all_proxy
  no_proxy_variables:
    - NO_PROXY
    - no_proxy
  # A single certificate authority bundle file. The first variable that is set
  # and names an existing file wins.
  ca_bundle_variables:
    - ENTRASCOPE_CA_BUNDLE
    - REQUESTS_CA_BUNDLE
    - SSL_CERT_FILE
    - CURL_CA_BUNDLE
  # A directory of hashed certificate authority certificates, the OpenSSL
  # convention. Used when no bundle file is set.
  ca_directory_variables:
    - SSL_CERT_DIR

concurrency:
  max_workers: 8

paging:
  page_size: 999
  max_pages: 1000
  # Endpoints that reject a custom page size with Request_UnsupportedQuery.
  # Microsoft Graph accepts $top on most collections and refuses it on these.
  no_page_size:
    - subscribed_skus
    - organization
    - directory_roles
    - me
