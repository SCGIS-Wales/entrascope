# The credential contract and the authentication sources.
# See docs/steering/credentials-and-security.md.

file:
  directory: ~/.entra
  filename: provisioner-credentials.json
  required_directory_mode: "0700"
  required_file_mode: "0600"
  keys:
    client_id: ClientID
    secret: Secret
    tenant_id: TenantID

environment:
  client_id: ARM_CLIENT_ID
  secret: ARM_CLIENT_SECRET
  tenant_id: ARM_TENANT_ID

sources:
  # Resolution order when --auth is not given. A source is tried automatically
  # only when it is enabled here. Naming a source with --auth selects it
  # whether or not it is enabled, so az login and --auth azure-cli work with no
  # configuration change.
  order: [file, env, azure-cli, default]
  enabled:
    file: true
    env: false
    azure-cli: false
    default: false
  identity_kind:
    file: application
    env: application
    azure-cli: delegated
    default: unknown
