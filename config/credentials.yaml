# The credential contract and the authentication sources.
# See docs/steering/credentials-and-security.md.

file:
  # Where the credential file lives. Both of these are settable without editing
  # a file by hand: entrascope config credentials --directory and --file write
  # them into your own configuration directory, where they survive an upgrade.
  directory: ~/.entra
  filename: provisioner-credentials.json
  required_directory_mode: "0700"
  required_file_mode: "0600"
  # Naming a different file needs no configuration change: pass --credentials
  # with a name inside the directory above, or a path of its own, or set the
  # variable below. A tenant for staging and one for production are ordinarily
  # two files side by side.
  environment_variable: ENTRASCOPE_CREDENTIAL_FILE
  # What entrascope looks at when the configured file is not there. Every file
  # matching this is offered, and the one chosen is remembered.
  discovery_glob: "*.json"
  keys:
    client_id: ClientID
    secret: Secret
    tenant_id: TenantID

# A certificate instead of a secret. Entra accepts either for an application,
# and a certificate is the better of the two: it is not transmitted, it cannot
# be read out of a log, and an expiry is visible on the file itself.
#
# These keys are optional. A file carrying the certificate path in place of the
# secret authenticates with a certificate, and one carrying both prefers the
# certificate. The keys sit in the same file as the rest, so nothing about
# where credentials live changes.
certificate:
  keys:
    # A PEM or PKCS12 file holding the certificate and its private key.
    path: CertificatePath
    # Only for a PKCS12 file that has one. A PEM key with no password needs
    # nothing here.
    password: CertificatePassword
    # Sends the public certificate chain in the x5c header, which is what
    # subject name and issuer authentication requires. Leave it out unless the
    # application is registered for it.
    send_chain: SendCertificateChain
  # The private key is exactly as sensitive as a secret, so the same mode is
  # required of it and entrascope refuses to run when it is readable by others.
  required_file_mode: "0600"
  # A path inside the credential file may be written relative to the credential
  # directory, which is what somebody means when they keep the key beside the
  # file that names it.
  resolve_relative_to_directory: true
  # Used when the credential file names no certificate of its own, so that a
  # machine set up to authenticate with one needs no change to every file on
  # it. Set with entrascope config credentials --certificate. The key in the
  # file wins where there is one.
  default_path: ""

environment:
  client_id: ARM_CLIENT_ID
  secret: ARM_CLIENT_SECRET
  tenant_id: ARM_TENANT_ID
  # The same names the Azure provider for Terraform uses, so a shell already
  # set up for one is set up for the other.
  certificate_path: ARM_CLIENT_CERTIFICATE_PATH
  certificate_password: ARM_CLIENT_CERTIFICATE_PASSWORD

sources:
  # Resolution order when --auth is not given. A source is tried automatically
  # only when it is enabled here, and naming one with --auth selects it whether
  # or not it is enabled.
  #
  # The credential file wins, so an unattended run behaves the same whatever
  # else is on the machine. The Azure CLI session comes next, because running
  # az login is a deliberate, visible act and refusing to use it would be
  # obtuse. The environment variables and the full azure-identity chain stay
  # off, because both can pick up an identity the engineer did not intend.
  order: [file, env, azure-cli, default]
  enabled:
    file: true
    env: false
    azure-cli: true
    default: false
  identity_kind:
    file: application
    env: application
    azure-cli: delegated
    default: unknown

# How each way of holding a credential is named wherever one is reported: the
# banner below, entrascope config credentials, and doctor.
kinds:
  secret: client secret
  certificate: client certificate
  session: signed in session
  chain: azure-identity chain
  none: none found

# One line at the start of a run saying what a command is about to
# authenticate as and which files are in force. Somebody running against the
# wrong tenant is the most expensive mistake this tool can help with, and it
# costs nothing to say which one is loaded before the answer arrives.
banner:
  enabled: true
  # Red because it is meant to be noticed rather than read past. Any colour
  # rich understands works here, and NO_COLOR switches it off entirely.
  colour: red
  # Written to standard error, so redirecting output to a file still gives you
  # the answer alone and the banner still reaches the screen.
  destination: stderr
  # Only for output somebody is reading. A banner in front of JSON is a banner
  # in somebody's parser.
  formats: [table]
  prefix: "credentials:"
