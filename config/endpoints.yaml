# Every endpoint entrascope talks to. Nothing here may be hardcoded in src.
# Templates use Python str.format placeholders.

graph:
  base_url: https://graph.microsoft.com
  version: v1.0
  beta_version: beta
  scope: https://graph.microsoft.com/.default
  resource_app_id: 00000003-0000-0000-c000-000000000000
  # Related collections fetched with the page rather than one call per object.
  # Reading the owners of six hundred applications one at a time is twelve
  # hundred calls and several minutes; expanded it is a handful of pages.
  # Graph shrinks the page when it expands, which is the price and it is small.
  expansions:
    applications: owners($select=id,displayName)
    service_principals: owners($select=id,displayName)
  paths:
    applications: /applications
    application_by_id: /applications/{object_id}
    application_owners: /applications/{object_id}/owners
    federated_identity_credentials: /applications/{object_id}/federatedIdentityCredentials
    service_principals: /servicePrincipals
    service_principal_by_id: /servicePrincipals/{object_id}
    service_principal_owners: /servicePrincipals/{object_id}/owners
    app_role_assignments: /servicePrincipals/{object_id}/appRoleAssignedTo
    oauth2_permission_grants: /oauth2PermissionGrants
    directory_audits: /auditLogs/directoryAudits
    sign_ins: /auditLogs/signIns
    provisioning: /auditLogs/provisioning
    subscribed_skus: /subscribedSkus
    directory_roles: /directoryRoles
    me: /me
    me_member_of: /me/memberOf
    organization: /organization
    service_principal_by_app_id: /servicePrincipals(appId='{app_id}')
    service_principal_member_of: /servicePrincipals/{object_id}/memberOf
    granted_app_roles: /servicePrincipals/{object_id}/appRoleAssignments
    conditional_access_policies: /identity/conditionalAccess/policies
    # Policies assigned to one enterprise application. Each one changes what a
    # token carries or how it is issued, and none of it is recorded on the
    # application itself, so an engineer comparing a registration against a
    # token it produced cannot see any of this.
    claims_mapping_policies: /servicePrincipals/{object_id}/claimsMappingPolicies
    home_realm_discovery_policies: /servicePrincipals/{object_id}/homeRealmDiscoveryPolicies
    token_lifetime_policies: /servicePrincipals/{object_id}/tokenLifetimePolicies
    # Which of a resource's delegated permissions an ordinary user may consent
    # to under the tenant's consent policy.
    delegated_permission_classifications: /servicePrincipals/{object_id}/delegatedPermissionClassifications
    administrative_units: /directory/administrativeUnits
    # The gallery. These are the applications that can be added to a tenant,
    # which is what somebody means by searching for an application by name.
    application_templates: /applicationTemplates

azure:
  arm_base_url: https://management.azure.com
  arm_api_version: "2021-05-01-preview"
  # The Entra diagnostic settings resource provider has its own API version.
  diagnostic_settings_api_version: "2017-04-01-preview"
  arm_scope: https://management.azure.com/.default
  log_analytics_scope: https://api.loganalytics.io/.default
  tenants_api_version: "2020-01-01"
  paths:
    diagnostic_settings: /providers/microsoft.aadiam/diagnosticSettings
    # Tenants this identity can reach. Azure Resource Manager knows, and
    # Microsoft Graph does not.
    tenants: /tenants

authority:
  base_url: https://login.microsoftonline.com
  # Token version 2 is required so that the issuer and audience match what the
  # remote server validates. See docs/steering/mcp-server.md.
  v2:
    issuer_template: https://login.microsoftonline.com/{tenant_id}/v2.0
    token_endpoint_template: https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token
    authorize_endpoint_template: https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/authorize
    jwks_uri_template: https://login.microsoftonline.com/{tenant_id}/discovery/v2.0/keys
    oidc_discovery_template: https://login.microsoftonline.com/{tenant_id}/v2.0/.well-known/openid-configuration
  v1:
    issuer_template: https://sts.windows.net/{tenant_id}/
    token_endpoint_template: https://login.microsoftonline.com/{tenant_id}/oauth2/token

portal:
  # Deep links into the Azure portal, so a name in a listing can be opened.
  # A terminal that understands hyperlinks makes them clickable; one that does
  # not shows the name unchanged, and --output plain carries the URL.
  base_url: https://portal.azure.com
  application: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/Overview/appId/{app_id}
  application_by_object: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/Overview/objectId/{object_id}
  enterprise_application: https://portal.azure.com/#view/Microsoft_AAD_IAM/ManagedAppMenuBlade/~/Overview/objectId/{object_id}
  user: https://portal.azure.com/#view/Microsoft_AAD_IAM/UserDetailsMenuBlade/~/Overview/userId/{object_id}
  group: https://portal.azure.com/#view/Microsoft_AAD_IAM/GroupDetailsMenuBlade/~/Overview/groupId/{object_id}
  audit_logs: https://portal.azure.com/#view/Microsoft_AAD_IAM/ActiveDirectoryMenuBlade/~/Audit
  sign_in_logs: https://portal.azure.com/#view/Microsoft_AAD_IAM/ActiveDirectoryMenuBlade/~/SignIns

releases:
  # Where to look for a newer version. Checked at most once a day, never
  # blocking a command, and silently skipped when there is no network.
  latest_url: https://api.github.com/repos/SCGIS-Wales/entrascope/releases/latest
  page_url: https://github.com/SCGIS-Wales/entrascope/releases
  package_name: entrascope

protected_resource_metadata:
  well_known_path: /.well-known/oauth-protected-resource
